<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="Form.css" />
</head>
<body>
    <form id ="contacto">
        <fieldset>
        <legend>Ingrese datos de contacto</legend>
<br />
        <label> Nombre completo: </label>
        <input type ="text" 
        placeholder="Ingrese su nombre" 
        required 
        id ="nombre"> 
<br />
        <label> Rut: </label>
        <input type ="text" 
        placeholder="Formato 12345678-9" 
        required 
        id ="rut"> 

<br />
        <label> Correo: </label>
        <input type="email" required id="correo">

<br />
        <label> Telefono: </label>
        <input type="tel" required id="telefono">

<br />
        <label> Fecha Nacimiento: </label>
        <input type="date" required id="fenac">

<br />
        <label> Seleccione un producto: </label>
        <select required id="productos">
            <option value = "">Seleccione un producto</option>
            
            <option value = "prod1">Bartop</option>
            <option value = "prod2">Lowboy</option>
            <option value = "prod3">Uprigth</option>
            <option value = "prod4">Cocktail</option>
            <option value = "prod5">Ritmo y Baile</option>
            <option value = "prod6">Sit-in</option>
            <option value = "prod7">Máquina de Gancho</option>
            <option value = "prod8">Accesorios y périfericos</option>

        </select>
<br />
        <label> Cantidad: </label>
        <input type = "number"
        min="1"
        max = "99"
        id = "cantidad">
<br />
        
<label class="titulo-pago"> Forma de pago: </label>
<div class="opciones-pago">
    <label><input type="radio" name="pago" id="credito"> Crédito</label>
    <label><input type="radio" name="pago" id="debito"> Débito</label>
    <label><input type="radio" name="pago" id="tarjeta"> Tarjeta</label>
</div>
        <button type="submit">Aceptar</button>
    </form>

    <script src="validarForm.js"></script>
</body>
</html>
