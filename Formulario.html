<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id ="contacto">
        <fieldset>
        <legend>Ingrese datos de contacto</legend>
<br />
        <label> Nombre completo: </label>
        <input type ="text" 
        placeholder="Ingrese su nombre" 
        required 
        id ="nombre"> 
<br />
        <label> Rut: </label>
        <input type ="text" 
        placeholder="Formato 12345678-9" 
        required 
        id ="rut"> 

<br />
        <label> Correo: </label>
        <input type="email" required id="correo">

<br />
        <label> Telefono: </label>
        <input type="tel" required id="telefono">

<br />
        <label> Fecha Nacimiento: </label>
        <input type="date" required id="fenac">

<br />
        <label> Seleccione un producto: </label>
        <select required id="productos">
            <option value = "">Seleccione un producto</option>
            
            <option value = "prod1">Papitas</option>
            <option value = "prod2">Chocolate</option>
            <option value = "prod3">Popcorn</option>
            <option value = "prod4">Bebida</option>
        </select>
<br />
        <label> Cantidad: </label>
        <input type = "number"
        min="10"
        max = "99"
        id = "cantidad">
<br />
        <label> Forma de pago: </label>
<br/>
        <label> Credito: </label>
        <input type="radio" name="pago" id="credito">
<br/>
        <label> Debito: </label>
        <input type="radio" name="pago" id="debito">
<br/>
        <label> Tarjeta: </label>
        <input type="radio" name="pago" id="tarjeta">
<br/>
        <button type="submit">Aceptar</button>
        </fieldset>
    </form>

    <script src="validarForm.js"></script>
</body>
</html>
