<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form id="contacto">
        <fieldset>
            <legend>Ingrese datos de contacto</legend>
            <label>Nombre Completo:</label>
            <input type="text" placeholder="Ingrese su nombre"  id="nombre">

            <br />

            <label>RUT:</label>
            <input type="text" placeholder="Formato 212345678-9"  id="rut">

            <br />

            <label>Email:</label>
            <input type="email" required id="correo">

            <br />

            <label>Telefono:</label>
            <input type="tel" id="telefono">

            <br />

            <label>Fecha de Nacimiento:</label>
            <input type="date" id="fenac" >

            <br />

            <label>Selecciona un producto:</label>
            <select id="productos">
                <option value="">Seleccione un producto</option>
                <option value="prod_1">Papas</option>
                <option value="prod_2">Chocolate</option>
                <option value="prod_3">Popcorn</option>
                <option value="prod_4">Bebidas</option>
            </select>

            <br />

            <label>Cantidad:</label>
            <input type="number" min="10" max="99">

            <br />

            <label>Credito:</label>
            <input type="radio" name="Pago" id="credito">
            
            <label>Devito:</label>
            <input type="radio" name="Pago" id="debito">

            <label>Tarjeta:</label>
            <input type="radio" name="Pago" id="tarjeta" >

            <br />

            <button type="submit">Aceptar</button>

        </fieldset>
    </form>

    <script src="script_formulario.js"></script>
</body>
</html>
